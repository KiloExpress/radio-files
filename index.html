<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kilo Express Radio</title>
</head>

<body style="background:black;color:white;text-align:center;font-family:sans-serif">

<h2>🎧 Kilo Express Radio</h2>

<audio id="player" controls preload="metadata"></audio>

<script>
const tracks = [
  "1.mp3",
  "2.mp3",
  "3.mp3"
];

const player = document.getElementById("player");

function playRandom() {
  const next = tracks[Math.floor(Math.random() * tracks.length)];
  player.src = next;
  player.play();
}

player.addEventListener("ended", playRandom);

// Browsers require a user click to start audio
document.body.addEventListener("click", () => {
  if (player.paused) playRandom();
}, { once: true });
</script>

<p style="margin-top:20px;">Click anywhere to start the audio</p>

</body>
</html>
