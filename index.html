<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kilo Express Radio</title>

<style>
:root {
  --neon: #00ff66;
}

body {
  background: radial-gradient(circle at top, #002b18 0%, #000 70%);
  color: var(--neon);
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;
}

/* RADIO FRAME */
.radio {
  max-width: 320px;
  margin: auto;
  padding: 25px;
  border: 2px solid var(--neon);
  border-radius: 18px;
  position: relative;
  box-shadow:
    0 0 20px var(--neon),
    0 0 40px rgba(0,255,102,0.6);
  animation: pulse 2.8s infinite;
}

/* PULSE */
@keyframes pulse {
  0%   { box-shadow: 0 0 15px var(--neon); }
  50%  { box-shadow: 0 0 45px var(--neon); }
  100% { box-shadow: 0 0 15px var(--neon); }
}

/* TITLE */
h1 {
  margin: 0 0 15px;
  letter-spacing: 3px;
  text-shadow: 0 0 12px var(--neon);
}

/* DIGITAL DISPLAY */
.display {
  background: #000;
  border: 1px solid var(--neon);
  padding: 12px;
  margin-bottom: 18px;
  font-size: 13px;
  position: relative;
  overflow: hidden;
}

/* SCANLINE EFFECT */
.display::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,102,0.05),
    rgba(0,255,102,0.05) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

.track {
  font-size: 16px;
  margin-top: 6px;
  text-shadow: 0 0 10px var(--neon);
}

/* BUTTON */
button {
  background: transparent;
  border: 2px solid var(--neon);
  color: var(--neon);
  padding: 12px 26px;
  font-size: 16px;
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 1px;
  text-shadow: 0 0 8px var(--neon);
  box-shadow: 0 0 20px var(--neon);
  transition: 0.2s;
}

button:hover {
  background: var(--neon);
  color: #000;
  box-shadow: 0 0 35px var(--neon);
}
</style>
</head>

<body>

<div class="radio">
  <h1>KILO EXPRESS</h1>

  <div class="display">
    <div>NOW PLAYING</div>
    <div class="track" id="trackName">—</div>
  </div>

  <button id="playBtn">▶ PLAY</button>
</div>

<audio id="player"></audio>

<script>
const tracks = [
  { file: "1.mp3", name: "Track 1" },
  { file: "2.mp3", name: "Track 2" },
  { file: "3.mp3", name: "Track 3" }
];

const player = document.getElementById("player");
const btn = document.getElementById("playBtn");
const label = document.getElementById("trackName");

function playRandom() {
  const pick = tracks[Math.floor(Math.random() * tracks.length)];
  player.src = pick.file;
  label.textContent = pick.name;
  player.play();
}

btn.addEventListener("click", playRandom);
player.addEventListener("ended", playRandom);
</script>

</body>
</html>
