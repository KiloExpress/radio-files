<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kilo Express Radio</title>

<style>
:root {
  --neon: #00ff66;
}

body {
  margin: 0;
  background:
    repeating-linear-gradient(
      0deg,
      #000 0px,
      #000 2px,
      #020 3px
    );
  color: var(--neon);
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 10px;
  overflow: hidden;
}

/* BACKGROUND GRID */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,255,102,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,102,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* RADIO SHELL */
.radio {
  max-width: 340px;
  margin: auto;
  padding: 24px;
  border: 2px solid var(--neon);
  border-radius: 18px;
  box-shadow: 0 0 25px var(--neon), 0 0 60px rgba(0,255,102,0.5);
  animation: pulse 3s infinite;
  position: relative;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px var(--neon); }
  50% { box-shadow: 0 0 60px var(--neon); }
  100% { box-shadow: 0 0 20px var(--neon); }
}

/* HEADER */
h1 {
  margin: 0;
  letter-spacing: 4px;
  text-shadow: 0 0 14px var(--neon);
}

/* LIVE DOT */
.live {
  margin-top: 6px;
  font-size: 12px;
  letter-spacing: 2px;
}

.live span {
  color: red;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* DISPLAY */
.display {
  background: #000;
  border: 1px solid var(--neon);
  padding: 10px;
  margin: 16px 0;
  position: relative;
  overflow: hidden;
}

.display::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,102,0.08),
    rgba(0,255,102,0.08) 1px,
    transparent 2px,
    transparent 4px
  );
}

.track {
  font-size: 16px;
  margin-top: 4px;
  text-shadow: 0 0 10px var(--neon);
}

/* CONTROLS */
.controls button {
  background: transparent;
  border: 2px solid var(--neon);
  color: var(--neon);
  padding: 10px 16px;
  margin: 6px;
  font-size: 14px;
  border-radius: 25px;
  cursor: pointer;
  box-shadow: 0 0 15px var(--neon);
}

.controls button:hover {
  background: var(--neon);
  color: #000;
}

/* VU METER */
.vu {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin: 12px 0;
}

.bar {
  width: 6px;
  height: 12px;
  background: var(--neon);
  animation: vu 1s infinite;
}

.bar:nth-child(2){animation-delay:.2s}
.bar:nth-child(3){animation-delay:.4s}
.bar:nth-child(4){animation-delay:.6s}
.bar:nth-child(5){animation-delay:.8s}

@keyframes vu {
  0% { height: 6px; opacity:.4 }
  50% { height: 22px; opacity:1 }
  100% { height: 6px; opacity:.4 }
}

/* VOLUME */
input[type=range] {
  width: 80%;
}

/* TIMER */
.timer {
  font-size: 12px;
  margin-top: 6px;
  opacity: .8;
}
</style>
</head>

<body>

<div class="radio">
  <h1>KILO EXPRESS</h1>
  <div class="live">● <span>LIVE</span></div>

  <div class="display">
    <div>NOW PLAYING</div>
    <div class="track" id="trackName">—</div>
  </div>

  <div class="vu">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="controls">
    <button id="playBtn">▶ / ⏸</button>
    <button id="skipBtn">⏭</button>
  </div>

  <input type="range" min="0" max="1" step="0.01" id="vol" value="1">

  <div class="timer" id="timer">00:00</div>
</div>

<audio id="player"></audio>

<script>
const tracks = [
  { file: "1.mp3", name: "Credit Punch - SINNER ANTHEM" },
  { file: "2.mp3", name: "Credit Punch Ft Bobby Nolan - Gringo" },
  { file: "3.mp3", name: "Credit Punch Ft Bobby Nolan - Me No Asylum Seek" }
];

const player = document.getElementById("player");
const label = document.getElementById("trackName");
const playBtn = document.getElementById("playBtn");
const skipBtn = document.getElementById("skipBtn");
const vol = document.getElementById("vol");
const timer = document.getElementById("timer");

let current = null;
let startTime = Date.now();

function pickTrack() {
  current = tracks[Math.floor(Math.random() * tracks.length)];
  player.src = current.file;
  label.textContent = current.name;
  player.play();
}

playBtn.onclick = () => {
  if (player.paused) {
    if (!player.src) pickTrack();
    else player.play();
  } else {
    player.pause();
  }
};

skipBtn.onclick = pickTrack;
player.onended = pickTrack;
vol.oninput = () => player.volume = vol.value;

// SESSION TIMER
setInterval(() => {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(s / 60)).padStart(2,"0");
  const r = String(s % 60).padStart(2,"0");
  timer.textContent = `${m}:${r}`;
}, 1000);
</script>

</body>
</html>
